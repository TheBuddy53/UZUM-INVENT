<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>UZUM · Инвентаризация</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root {
    --purple: #7000FF;
    --purple-light: #9D4DFF;
    --purple-dark: #320073;
    --purple-glow: rgba(112, 0, 255, 0.85);
    --bg-base: #030008;

    --glass-bg: linear-gradient(150deg, rgba(50, 20, 90, 0.28), rgba(10, 2, 25, 0.45));
    --glass-border-light: rgba(255, 255, 255, 0.35);
    --glass-border-dark: rgba(255, 255, 255, 0.08);

    --text-main: #FFFFFF;
    --text-muted: #B8AEE0;
    --text-dim: #6B5E8C;
    --text-hint: #D7CDF2;
    --accent-key: #FFD3E8;
    --accent-key-glow: rgba(255, 168, 214, 0.65);
    --green: #34C77B;
    --green-glow: rgba(52, 199, 123, 0.7);
    --red: #FF3B30;
    --orange: #FF9F0A;
    --yellow: #FFD60A;

    --r-xl: 24px;
    --r-lg: 16px;
    --r-md: 12px;

    /* Обновленные кинематографичные кривые Безье */
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease: cubic-bezier(0.25, 1, 0.15, 1);
    --epic: cubic-bezier(0.16, 1.36, 0.4, 1);
    --epic-out: cubic-bezier(0.6, 0, 0.85, 0.35);
    --saga-epic: cubic-bezier(0.22, 1.1, 0.36, 1); /* Для супер-слоумо логотипа */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background-color: var(--bg-base);
    font-family: "SF Pro Display", "Inter", -apple-system, sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    letter-spacing: -0.02em;
    padding: 12px 12px 24px;
    overflow-x: hidden;
    position: relative;
    perspective: 1200px;
  }

  /* Улучшенные текстуры шума и фона */
  #noise { position: fixed; inset: -50%; z-index: 999; pointer-events: none; opacity: 0.12; mix-blend-mode: overlay; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); animation: noiseShift 8s steps(10) infinite; transition: opacity 0.4s ease; will-change: transform; transform: translateZ(0); contain: paint; }
  #noise.flash { opacity: 0.38; }
  
  :root { --grain-url: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  @keyframes noiseShift { 0% { transform: translate(0,0); } 10% { transform: translate(-5%,-5%); } 20% { transform: translate(-10%,5%); } 30% { transform: translate(5%,-10%); } 40% { transform: translate(-5%,15%); } 50% { transform: translate(-10%,5%); } 60% { transform: translate(15%,0); } 70% { transform: translate(0,15%); } 80% { transform: translate(3%,35%); } 90% { transform: translate(-10%,10%); } 100% { transform: translate(0,0); } }

  /* Более премиальные насыщенные цвета меша */
  #mesh { position: fixed; inset: 0; z-index: -1; pointer-events: none; filter: blur(70px) saturate(160%); overflow: hidden; will-change: filter, transform; transform: translateZ(0); contain: paint; }
  #mesh-track { position: absolute; inset: -10%; }
  #mesh span { position: absolute; border-radius: 50%; will-change: transform; mix-blend-mode: screen; }
  #mesh .b1 { width: 85vw; height: 85vw; left: -10%; top: -10%; background: radial-gradient(circle, rgba(130,40,255,0.45), transparent 70%); animation: orbFloat1 22s infinite alternate var(--ease); }
  #mesh .b2 { width: 75vw; height: 75vw; right: -20%; top: 40%; background: radial-gradient(circle, rgba(200,100,255,0.35), transparent 70%); animation: orbFloat2 28s infinite alternate-reverse var(--ease); }
  #mesh .b3 { width: 95vw; height: 95vw; left: 10%; bottom: -30%; background: radial-gradient(circle, rgba(52, 199, 123, 0.25), transparent 70%); animation: orbFloat3 25s infinite alternate var(--ease); }
  @keyframes orbFloat1 { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 100% { transform: translate(20vw, 15vh) scale(1.25) rotate(45deg); } }
  @keyframes orbFloat2 { 0% { transform: translate(0, 0) scale(1) rotate(0deg); } 100% { transform: translate(-30vw, -20vh) scale(1.15) rotate(-30deg); } }
  @keyframes orbFloat3 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10vw, -30vh) scale(1.35); } }

  #watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) translateZ(0); z-index: -2; font-size: clamp(80px, 30vw, 160px); font-weight: 900; line-height: 1; color: transparent; background: linear-gradient(135deg, rgba(157,77,255,0.7), rgba(112,0,255,0.45) 45%, rgba(75,0,173,0.55)); -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: 2px rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; user-select: none; pointer-events: none; animation: premiumBreathe 4s ease-in-out infinite; will-change: opacity, filter; }
  @keyframes premiumBreathe { 0%, 100% { filter: drop-shadow(0 0 20px rgba(112,0,255,0.4)); opacity: 0.85; } 50% { filter: drop-shadow(0 0 45px rgba(157,77,255,0.85)); opacity: 1; } }

  .wrap { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 16px; }
  .stagger { opacity: 1 !important; transform: none !important; animation: riseIn 0.8s var(--spring) forwards; }
  @keyframes riseIn { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; padding: 0 8px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  
  /* Якорь-контейнер: держит размер 44х44, чтобы текст не прыгал, когда логотип вылетает */
  .brand-logo-container {
    width: 44px; height: 44px; position: relative; flex-shrink: 0; display: block;
  }

  .brand-mark {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, #A855F7, var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 20px; color: #fff;
    box-shadow: 0 10px 25px var(--purple-glow), inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -4px 10px rgba(0,0,0,0.3);
    position: relative; overflow: visible; cursor: pointer;
    transform: translateZ(0) scale(1);
    /* Задаем базовый transition для возврата */
    transition: transform 0.4s var(--ease);
  }
  .brand-mark:active:not(.saga-playing) { transform: scale(0.92) translateZ(0); }

  /* ============================================================
     ОБНОВЛЕННАЯ СЮЖЕТНАЯ АНИМАЦИЯ (СЛОУМО И ПЕРЕДНИЙ ПЛАН)
     ============================================================ */
  .brand-mark.saga-playing {
    position: fixed !important; 
    z-index: 999999 !important; /* Гарантированный передний план, перекроет даже шторки и toast */
    left: var(--saga-x, 0px); top: var(--saga-y, 0px);
    width: var(--saga-w, 44px); height: var(--saga-h, 44px);
    margin: 0; will-change: transform, left, top, width, height, box-shadow, background;
    /* Сильно замедленные, кинематографичные переходы */
    transition:
      left 1.8s var(--saga-epic), top 1.8s var(--saga-epic),
      width 1.8s var(--saga-epic), height 1.8s var(--saga-epic),
      box-shadow 1.2s var(--ease), background 1.2s var(--ease),
      border-radius 1.2s var(--ease);
  }
  .brand-mark .mark-letter { position: relative; z-index: 2; transition: opacity 0.4s ease; }

  /* --- Сцена 1: взлёт и полет к кнопке (Слоумо) --- */
  .brand-mark.saga-liftoff {
    left: var(--saga-target-x, 50vw); top: var(--saga-target-y, 50vh);
    width: 200px; height: 200px; border-radius: 40px;
    box-shadow: 0 50px 120px rgba(112,0,255,0.8), 0 0 60px rgba(157,77,255,0.5), inset 0 4px 10px rgba(255,255,255,0.5), inset 0 -10px 24px rgba(0,0,0,0.35);
  }
  .brand-mark.saga-liftoff .mark-letter { font-size: 90px; }

  /* --- Сцена 2: ярость (Увеличенный масштаб и эпичный свет) --- */
  .brand-mark.saga-rage {
    left: var(--saga-target-x, 50vw); top: var(--saga-target-y, 50vh);
    width: 230px; height: 220px; border-radius: 36px;
    background: linear-gradient(135deg, #FF5C5C, #C41818);
    box-shadow: 0 50px 150px rgba(255,40,40,0.85), 0 0 80px rgba(255,100,100,0.4), inset 0 4px 10px rgba(255,255,255,0.4), inset 0 -12px 26px rgba(0,0,0,0.5);
    animation: rageShake 0.42s ease-in-out infinite;
  }
  .brand-mark.saga-rage .mark-letter { font-size: 96px; text-shadow: 0 0 25px rgba(255,255,255,0.7); }
  
  @keyframes rageShake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-3px, 2px) rotate(-1.5deg); }
    50% { transform: translate(2px, -2px) rotate(1.5deg); }
    75% { transform: translate(-2px, -1px) rotate(-1deg); }
  }

  /* --- Сцена 3: удар --- */
  .brand-mark.saga-smash {
    left: var(--saga-target-x, 50vw); top: var(--saga-target-y, 50vh);
    width: 230px; height: 220px; border-radius: 36px;
    background: linear-gradient(135deg, #FF5C5C, #C41818);
    box-shadow: 0 60px 140px rgba(255,40,40,0.9), 0 0 100px rgba(255,50,50,0.5), inset 0 4px 10px rgba(255,255,255,0.35), inset 0 -12px 26px rgba(0,0,0,0.5);
    animation: smashJolt 0.5s cubic-bezier(0.2,0.9,0.3,1) 2;
  }
  /* Более тяжелый удар */
  @keyframes smashJolt {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(18px) scale(1.04, 0.92); }
    55% { transform: translateY(-5px) scale(0.97, 1.04); }
    100% { transform: translateY(0) scale(1); }
  }

  /* --- Сцена 4: неловкость --- */
  .brand-mark.saga-oops {
    left: var(--saga-target-x, 50vw); top: var(--saga-target-y, 50vh);
    width: 200px; height: 190px; border-radius: 38px;
    background: linear-gradient(135deg, #A855F7, var(--purple));
    box-shadow: 0 40px 90px var(--purple-glow), inset 0 4px 10px rgba(255,255,255,0.5), inset 0 -10px 22px rgba(0,0,0,0.35);
    transition: background 1.2s var(--ease), box-shadow 1.2s var(--ease), left 1.8s var(--saga-epic), top 1.8s var(--saga-epic), width 1.8s var(--saga-epic), height 1.8s var(--saga-epic);
  }
  .brand-mark.saga-oops .mark-letter { font-size: 84px; }

  /* --- Сцена 5: возврат --- */
  .brand-mark.saga-return {
    left: var(--saga-home-x, 0px); top: var(--saga-home-y, 0px);
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, #A855F7, var(--purple));
    box-shadow: 0 10px 25px var(--purple-glow), inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -4px 10px rgba(0,0,0,0.3);
  }
  .brand-mark.saga-return .mark-letter { font-size: 20px; }

  /* ---------- ЛИЦО ---------- */
  .mark-face { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.4s ease; }
  .brand-mark.saga-rage .mark-face,
  .brand-mark.saga-smash .mark-face,
  .brand-mark.saga-oops .mark-face { opacity: 1; }
  .brand-mark.saga-liftoff .mark-face { opacity: 0; }

  .mark-eye {
    position: absolute; top: 46%; width: 15%; height: 15%; border-radius: 50%;
    background: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.8);
    transition: all 0.4s var(--ease);
  }
  .mark-eye.l { left: 30%; } .mark-eye.r { right: 30%; }
  .mark-eye .pupil { position: absolute; inset: 22%; border-radius: 50%; background: #2a0845; transition: transform 0.4s ease; }

  .mark-brow {
    position: absolute; top: 34%; width: 15%; height: 4px; border-radius: 4px;
    background: rgba(30,0,20,0.85); opacity: 0; transition: all 0.4s var(--ease);
  }
  .mark-brow.l { left: 29%; transform: rotate(18deg); }
  .mark-brow.r { right: 29%; transform: rotate(-18deg); }

  .mark-mouth {
    position: absolute; left: 50%; top: 62%; width: 22%; height: 10%;
    margin-left: -11%; border-radius: 4px; background: #2a0845;
    transition: all 0.4s var(--ease);
  }

  .mark-blush { position: absolute; top: 56%; width: 12%; height: 8%; border-radius: 50%; background: rgba(255,120,150,0); transition: background 0.6s ease; }
  .mark-blush.l { left: 16%; } .mark-blush.r { right: 16%; }

  .mark-sweat {
    position: absolute; top: 20%; right: 14%; width: 8%; height: 12%;
    background: #8ED4FF; border-radius: 50% 50% 50% 0; transform: rotate(45deg) scale(0);
    opacity: 0; box-shadow: 0 0 8px rgba(142,212,255,0.9);
    transition: transform 0.4s var(--spring), opacity 0.4s ease;
  }

  /* Ярость */
  .brand-mark.saga-rage .mark-brow,
  .brand-mark.saga-smash .mark-brow { opacity: 1; top: 38%; }
  .brand-mark.saga-rage .mark-brow.l,
  .brand-mark.saga-smash .mark-brow.l { transform: rotate(28deg); left: 32%; }
  .brand-mark.saga-rage .mark-brow.r,
  .brand-mark.saga-smash .mark-brow.r { transform: rotate(-28deg); right: 32%; }
  .brand-mark.saga-rage .mark-eye,
  .brand-mark.saga-smash .mark-eye { height: 6%; border-radius: 3px; background: #fff; }
  .brand-mark.saga-rage .mark-mouth,
  .brand-mark.saga-smash .mark-mouth { height: 14%; border-radius: 3px; background: #2a0845; clip-path: polygon(0 0,12% 60%,24% 0,36% 60%,48% 0,60% 60%,72% 0,84% 60%,100% 0,100% 100%,0 100%); }

  .mark-vein {
    position: absolute; top: 8%; width: 4px; height: 30%; border-radius: 3px;
    background: linear-gradient(180deg, transparent, #6A0000, transparent);
    opacity: 0; transform: scaleY(0.4); transition: all 0.5s var(--ease);
  }
  .mark-vein.l { left: 12%; transform: rotate(-6deg) scaleY(0.4); }
  .mark-vein.r { right: 12%; transform: rotate(6deg) scaleY(0.4); }
  .brand-mark.saga-rage .mark-vein,
  .brand-mark.saga-smash .mark-vein { opacity: 0.9; transform: scaleY(1) rotate(0deg); }
  .brand-mark.saga-rage .mark-vein.l,
  .brand-mark.saga-smash .mark-vein.l { transform: rotate(-4deg) scaleY(1); }
  .brand-mark.saga-rage .mark-vein.r,
  .brand-mark.saga-smash .mark-vein.r { transform: rotate(4deg) scaleY(1); }

  /* Смущение */
  .brand-mark.saga-oops .mark-brow { opacity: 1; top: 32%; }
  .brand-mark.saga-oops .mark-brow.l { transform: rotate(-14deg); left: 30%; }
  .brand-mark.saga-oops .mark-brow.r { transform: rotate(14deg); right: 30%; }
  .brand-mark.saga-oops .mark-eye { height: 20%; width: 17%; top: 42%; }
  .brand-mark.saga-oops .mark-eye .pupil { inset: 30%; transform: translateY(2px); }
  .brand-mark.saga-oops .mark-mouth { width: 12%; height: 12%; margin-left: -6%; border-radius: 50%; top: 66%; background: #2a0845; clip-path: none; }
  .brand-mark.saga-oops .mark-blush { background: rgba(255,140,170,0.65); }
  .brand-mark.saga-oops .mark-sweat { opacity: 1; transform: rotate(45deg) scale(1); animation: sweatDrop 1.2s ease-in infinite; }
  @keyframes sweatDrop { 0% { transform: rotate(45deg) scale(1) translateY(0); opacity: 1; } 100% { transform: rotate(45deg) scale(0.8) translateY(12px); opacity: 0; } }

  /* ---------- РУКИ ---------- */
  .mark-arm {
    position: absolute; top: 50%; width: 15%; height: 36px; margin-top: -18px;
    background: linear-gradient(180deg, #FF7A7A, #B21212);
    border-radius: 10px; opacity: 0; pointer-events: none;
    box-shadow: 0 5px 16px rgba(180,20,20,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
    transition: opacity 0.35s ease, transform 0.5s var(--spring);
  }
  .mark-arm.l { left: -10%; transform: translateX(-40px) rotate(-10deg) scale(0.6); transform-origin: right center; }
  .mark-arm.r { right: -10%; transform: translateX(40px) rotate(10deg) scale(0.6); transform-origin: left center; }
  .mark-arm .fist {
    position: absolute; width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #FF7A7A, #B21212);
    box-shadow: inset 0 3px 6px rgba(255,255,255,0.5), inset 0 -4px 8px rgba(0,0,0,0.4), 0 5px 12px rgba(180,20,20,0.6);
  }
  .mark-arm.l .fist { left: -19px; top: 50%; margin-top: -14px; }
  .mark-arm.r .fist { right: -19px; top: 50%; margin-top: -14px; }

  .brand-mark.saga-rage .mark-arm,
  .brand-mark.saga-smash .mark-arm { opacity: 1; }
  .brand-mark.saga-rage .mark-arm.l,
  .brand-mark.saga-smash .mark-arm.l { transform: translateX(-6px) rotate(-16deg) scale(1); }
  .brand-mark.saga-rage .mark-arm.r,
  .brand-mark.saga-smash .mark-arm.r { transform: translateX(6px) rotate(16deg) scale(1); }

  /* Замедленные тяжелые удары */
  .brand-mark.saga-smash .mark-arm.l { animation: punchLeft 0.5s cubic-bezier(0.2,0.9,0.3,1) 2; }
  .brand-mark.saga-smash .mark-arm.r { animation: punchRight 0.5s cubic-bezier(0.2,0.9,0.3,1) 2; }
  @keyframes punchLeft {
    0% { transform: translateX(-6px) rotate(-16deg) scale(1); }
    40% { transform: translateX(12px) translateY(50px) rotate(6deg) scale(1.08); }
    100% { transform: translateX(-6px) rotate(-16deg) scale(1); }
  }
  @keyframes punchRight {
    0% { transform: translateX(6px) rotate(16deg) scale(1); }
    40% { transform: translateX(-12px) translateY(50px) rotate(-6deg) scale(1.08); }
    100% { transform: translateX(6px) rotate(16deg) scale(1); }
  }

  .brand-mark.saga-oops .mark-arm { opacity: 0; transform: translateX(0) scale(0.6); transition: opacity 0.4s ease, transform 0.5s var(--ease); }

  /* Импульсная вспышка удара (Слоумо) */
  .brand-mark .impact-flash {
    position: absolute; left: 50%; bottom: -16px; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: radial-gradient(circle, #fff, rgba(255,230,140,0.95) 40%, transparent 75%);
    opacity: 0; pointer-events: none;
  }
  .brand-mark.saga-smash .impact-flash { animation: impactPulse 0.5s ease-out 2; }
  @keyframes impactPulse {
    0% { opacity: 0; transform: scale(0.3); }
    30% { opacity: 1; transform: scale(7); }
    100% { opacity: 0; transform: scale(10); }
  }

  .brand-text { display: flex; flex-direction: column; gap: 2px; }
  .brand-name { font-weight: 900; font-size: 18px; letter-spacing: -0.03em; text-shadow: 0 2px 10px rgba(255,255,255,0.25); }
  .brand-sub { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 800; background: linear-gradient(90deg, var(--text-muted), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .topbar-actions { display: flex; align-items: center; gap: 8px; }

  .icon-btn { width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border: 1px solid var(--glass-border-dark); border-top: 1px solid var(--glass-border-light); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.3s var(--spring); cursor: pointer; position: relative; transform: translateZ(0); }
  .icon-btn::before { content: ''; position: absolute; inset: -7px; border-radius: inherit; background: radial-gradient(circle, rgba(157,77,255,0.55), transparent 70%); filter: blur(9px); z-index: -1; pointer-events: none; animation: iconIdle 3.4s ease-in-out infinite; will-change: opacity, transform; }
  @keyframes iconIdle { 0%, 100% { opacity: 0.18; transform: scale(0.9); } 50% { opacity: 0.42; transform: scale(1.1); } }
  .icon-btn:active { transform: scale(0.9) translateZ(0); }

  .lang-switch {
    position: relative; height: 44px; padding: 0 14px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--glass-border-dark); border-top: 1px solid var(--glass-border-light);
    cursor: pointer; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.25s var(--spring), box-shadow 0.3s var(--ease);
    transform: translateZ(0);
    animation: langBreathe 4.5s ease-in-out infinite;
  }
  @keyframes langBreathe {
    0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(157,77,255,0.35), 0 0 14px rgba(157,77,255,0.25); }
  }
  .lang-switch:active { transform: scale(0.92) translateZ(0); }
  .lang-switch .lang-cur { font-weight: 900; font-size: 13px; letter-spacing: 0.05em; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
  .lang-switch .lang-globe { font-size: 14px; display: inline-block; opacity: 0.9; }

  /* ============================================================
     НОВЫЙ КИНЕМАТОГРАФИЧНЫЙ БЛИК ПО КРАЯМ РАМОК (ПРЕМИАЛЬНЫЙ СВЕТ)
     Эффект скользящего дорогого света вдоль границ.
     ============================================================ */
  .cinematic-glare {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    padding: 1.5px; /* Толщина премиум-бортика */
    background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,0.85) 40%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0.85) 60%, transparent 80%);
    background-size: 250% 100%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: cinematicSweep 8s cubic-bezier(0.3, 0, 0.7, 1) infinite;
    z-index: 10; opacity: 0.75;
  }
  @keyframes cinematicSweep {
    0% { background-position: 250% 0; }
    100% { background-position: -150% 0; }
  }

  .card { position: relative; background: var(--glass-bg); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); border: 1px solid var(--glass-border-dark); border-top: 1px solid var(--glass-border-light); border-left: 1px solid rgba(255,255,255,0.18); border-radius: var(--r-xl); padding: 20px; box-shadow: 0 24px 48px -12px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.35); overflow: hidden; transform: translateZ(0); animation: floatCard 8s infinite ease-in-out; will-change: transform; }
  .card:nth-child(2) { animation-delay: -2s; }
  .card:nth-child(3) { animation-delay: -4s; }
  @keyframes floatCard { 0%, 100% { transform: translateY(0) translateZ(0); } 50% { transform: translateY(-4px) translateZ(0); } }
  
  .card::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, -20%), rgba(255,255,255,0.08), transparent 45%); transition: background 0.15s linear; z-index: 1; }
  .card { isolation: isolate; }
  .card .grain { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: var(--grain-url); background-size: 180px 180px; opacity: 0.08; mix-blend-mode: overlay; border-radius: inherit; z-index: 1; }
  .card > *:not(.grain):not(.cinematic-glare) { position: relative; z-index: 2; }
  .card::after { content: ''; position: absolute; top: -60%; left: -40%; width: 45%; height: 220%; background: linear-gradient(75deg, transparent, rgba(255,255,255,0.07), transparent); transform: translateX(-20%) rotate(8deg); animation: cardSheen 9s ease-in-out infinite; pointer-events: none; will-change: transform; }
  .card:nth-child(2)::after { animation-delay: -3s; }
  .card:nth-child(3)::after { animation-delay: -6s; }
  @keyframes cardSheen { 0%, 55% { transform: translateX(-20%) rotate(8deg); } 100% { transform: translateX(480%) rotate(8deg); } }
  .card.replay { animation: riseIn 0.7s var(--epic) forwards, floatCard 8s infinite ease-in-out 0.7s; }

  .btn { border: none; border-radius: var(--r-lg); padding: 16px; font-weight: 900; font-size: 14px; letter-spacing: 0.02em; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s var(--spring); width: 100%; position: relative; overflow: hidden; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
  .btn:active { transform: scale(0.96) translateY(2px); }
  .btn.primary { background: linear-gradient(135deg, var(--purple-light), var(--purple)); box-shadow: 0 12px 24px var(--purple-glow), inset 0 2px 4px rgba(255,255,255,0.5), inset 0 -4px 12px rgba(0,0,0,0.3); }
  .btn.finish { background: linear-gradient(135deg, #38E888, #0F9D58); box-shadow: 0 12px 24px var(--green-glow), inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -4px 12px rgba(0,0,0,0.3); animation: pulseFinish 3s infinite; will-change: box-shadow, transform; }
  @keyframes pulseFinish { 0%,100% { box-shadow: 0 12px 24px var(--green-glow), inset 0 2px 4px rgba(255,255,255,0.6); } 50% { box-shadow: 0 16px 32px rgba(52, 199, 123, 0.9), inset 0 2px 4px rgba(255,255,255,0.6); transform: scale(1.02); } }

  .finish-slot { position: relative; overflow: hidden; border-radius: var(--r-lg); }
  .finish-slot .btn.finish { position: relative; z-index: 1; }
  
  /* Более тяжелое и медленное падение кнопки */
  .btn.finish.smashed {
    animation: none;
    transition: transform 0.85s cubic-bezier(0.5,0,0.85,0.35), opacity 0.7s ease 0.2s, box-shadow 0.6s ease;
    transform: translateY(140%) rotate(4deg) scale(0.92);
    opacity: 0;
    box-shadow: none;
  }
  .btn.finish.restoring {
    animation: none;
    transform: translateY(-24%) scale(0.96); opacity: 0;
    transition: none;
  }
  .btn.finish.restore-in {
    transition: transform 0.8s var(--spring), opacity 0.6s ease;
    transform: translateY(0) scale(1); opacity: 1;
  }

  .finish-hole {
    position: absolute; inset: 0; border-radius: var(--r-lg);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(120% 140% at 50% 0%, rgba(0,0,0,0.9), rgba(10,2,20,0.95) 55%, rgba(3,0,8,0.98)),
      linear-gradient(180deg, rgba(112,0,255,0.15), transparent 40%);
    box-shadow: inset 0 18px 30px rgba(0,0,0,0.9), inset 0 2px 6px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(157,77,255,0.15);
    transition: opacity 0.45s ease;
  }
  .finish-hole.hole-active { opacity: 1; }
  .hole-rim {
    position: absolute; inset: 0; border-radius: var(--r-lg);
    box-shadow: inset 0 0 0 1.5px rgba(157,77,255,0.35), inset 0 10px 22px rgba(0,0,0,0.85);
    background: radial-gradient(ellipse at 50% -10%, rgba(157,77,255,0.18), transparent 60%);
  }
  .hole-debris {
    position: absolute; left: 50%; top: 30%; width: 60%; height: 40%; margin-left: -30%;
    background-image:
      radial-gradient(circle, rgba(157,77,255,0.5) 0 2px, transparent 3px),
      radial-gradient(circle, rgba(255,255,255,0.3) 0 1.5px, transparent 2.5px);
    background-size: 22px 18px, 14px 12px;
    background-position: 0 0, 8px 6px;
    opacity: 0.5; filter: blur(0.2px);
  }
  .hole-dust {
    position: absolute; left: 50%; top: 10%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
    background: radial-gradient(circle, rgba(220,200,255,0.55), transparent 70%);
    opacity: 0; filter: blur(2px);
  }
  .finish-hole.hole-active .hole-dust { animation: dustPuff 1.6s ease-out; }
  @keyframes dustPuff {
    0% { opacity: 0; transform: scale(0.4) translateY(0); }
    25% { opacity: 0.9; transform: scale(1.8) translateY(5px); }
    100% { opacity: 0; transform: scale(3.2) translateY(22px); }
  }

  #btn-paste-wms {
    position: relative;
    animation: pasteBreathe 2.6s ease-in-out infinite;
    will-change: box-shadow, transform;
  }
  @keyframes pasteBreathe {
    0%, 100% { box-shadow: 0 12px 24px var(--purple-glow), inset 0 2px 4px rgba(255,255,255,0.5), inset 0 -4px 12px rgba(0,0,0,0.3); }
    50% { box-shadow: 0 16px 40px rgba(157,77,255,0.95), 0 0 30px rgba(157,77,255,0.5), inset 0 2px 4px rgba(255,255,255,0.7), inset 0 -4px 12px rgba(0,0,0,0.3); transform: scale(1.015); }
  }
  
  #btn-paste-wms::after {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.45) 48%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0.45) 52%, transparent 65%);
    background-size: 300% 100%; background-position: 130% 0;
    animation: pasteShine 3.6s linear infinite;
    mix-blend-mode: overlay; pointer-events: none;
  }
  @keyframes pasteShine { 0% { background-position: 160% 0; } 100% { background-position: -60% 0; } }
  
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.6); transform: scale(0); pointer-events: none; animation: rippleOut 0.7s var(--ease) forwards; }
  @keyframes rippleOut { to { transform: scale(1); opacity: 0; } }

  .footer { text-align: center; margin-top: 24px; opacity: 0.6; padding-bottom: 20px; }
  .footer-mark { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
  .footer-mark .fdot { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg, var(--purple), var(--purple-dark)); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff; box-shadow: 0 4px 10px var(--purple-glow); animation: fdotPulse 3s ease-in-out infinite; }
  @keyframes fdotPulse { 0%, 100% { box-shadow: 0 4px 10px var(--purple-glow); } 50% { box-shadow: 0 4px 16px rgba(157,77,255,0.9); } }

  #toast { position: fixed; left: 16px; right: 16px; bottom: 32px; max-width: 420px; margin: 0 auto; background: rgba(20, 10, 35, 0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(157,77,255,0.5); border-top: 1px solid rgba(255,255,255,0.3); border-radius: var(--r-lg); padding: 16px; font-size: 14px; font-weight: 800; text-align: center; transform: translateY(calc(100% + 60px)) scale(0.9); transition: all 0.5s var(--spring); z-index: 200; box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 30px var(--purple-glow); }
  #toast.show { transform: translateY(0) scale(1); }

  #sheet-overlay { position: fixed; inset: 0; z-index: 300; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0; pointer-events: none; transition: opacity 0.5s var(--ease); transform: translateZ(0); }
  #sheet-overlay.show { opacity: 1; pointer-events: auto; }

  #paste-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 301; max-width: 480px; margin: 0 auto;
    background: linear-gradient(180deg, rgba(30,15,50,0.95), rgba(10,2,20,0.98));
    backdrop-filter: blur(40px) saturate(220%); -webkit-backdrop-filter: blur(40px) saturate(220%);
    border: 1px solid var(--glass-border-dark); border-top: 1px solid rgba(255,255,255,0.25);
    border-radius: 32px 32px 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -20px 60px rgba(0,0,0,0.9), inset 0 2px 10px rgba(255,255,255,0.1);
    transform: translateY(100%); max-height: 80vh; display: flex; flex-direction: column;
    transform-origin: center bottom; visibility: hidden; pointer-events: none;
  }
  #paste-sheet.show { visibility: visible; animation: sheetEpicIn 0.85s var(--epic) forwards; pointer-events: auto; }
  #paste-sheet.closing { visibility: visible; animation: sheetEpicOut 0.5s var(--epic-out) forwards; }
  @keyframes sheetEpicIn {
    0%   { transform: translateY(65%) scale(0.92) rotateX(6deg); filter: blur(22px) brightness(0.5) saturate(1.4); opacity: 0; }
    40%  { transform: translateY(-3%) scale(1.015) rotateX(-1deg); filter: blur(3px) brightness(1.4) saturate(1.6); opacity: 1; }
    68%  { transform: translateY(1.5%) scale(0.997) rotateX(0.4deg); filter: blur(0px) brightness(1.08) saturate(1.1); }
    100% { transform: translateY(0) scale(1) rotateX(0deg); filter: blur(0) brightness(1) saturate(1); }
  }
  @keyframes sheetEpicOut {
    0%   { transform: translateY(0) scale(1); filter: blur(0) brightness(1); }
    100% { transform: translateY(100%) scale(0.95); filter: blur(10px) brightness(0.5); }
  }
  
  .sheet-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 16px; }
  .sheet-header { font-size: 20px; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .sheet-close { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-muted); cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
  .sheet-input { width: 100%; height: 180px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; color: #fff; font-family: "SF Pro Display", "Inter", monospace; font-size: 14px; resize: none; margin-bottom: 16px; outline: none; box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); }
  .sheet-input:focus { border-color: rgba(157,77,255,0.5); box-shadow: inset 0 4px 10px rgba(0,0,0,0.5), 0 0 15px rgba(157,77,255,0.3); }
</style>
</head>
<body>

<div id="noise"></div>
<div id="mesh">
  <div id="mesh-track">
    <span class="b1"></span><span class="b2"></span><span class="b3"></span>
  </div>
</div>
<div id="watermark">UZUM</div>

<div class="wrap">
  <div class="topbar stagger" style="animation-delay: 0.1s;">
    <div class="brand">
      <!-- Контейнер удерживает макет, чтобы текст не прыгал -->
      <div class="brand-logo-container" id="brand-logo-container">
        <div class="brand-mark" id="brand-mark">
          <span class="mark-letter">U</span>
          <div class="mark-face">
            <div class="mark-brow l"></div><div class="mark-brow r"></div>
            <div class="mark-eye l"><div class="pupil"></div></div>
            <div class="mark-eye r"><div class="pupil"></div></div>
            <div class="mark-mouth"></div>
            <div class="mark-blush l"></div><div class="mark-blush r"></div>
            <div class="mark-sweat"></div>
          </div>
          <div class="mark-arm l"><div class="fist"></div></div>
          <div class="mark-arm r"><div class="fist"></div></div>

      <div class="icon-btn" id="btn-camera" onclick="haptic('light')">📷</div>

        <span class="lang-cur">RU</span>

      </div>

  </div>

  <div class="card stagger" style="animation-delay: 0.2s;" id="card-1">
    <div class="grain"></div>
    <div class="cinematic-glare"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
      <h2 style="font-size: 18px; font-weight: 800;">WMS Данные</h2>
      <span style="font-size: 12px; font-weight: 700; color: var(--green); background: rgba(52, 199, 123, 0.15); padding: 4px 10px; border-radius: 8px;">Онлайн</span>

    <div style="display:flex; justify-content:space-between; margin-bottom: 12px; font-weight: 700;">
      <div style="color: var(--text-muted); font-size: 14px;">Отсканировано:</div>
      <div style="font-size: 18px;"><span id="scanned-count">0</span> / <span id="total-count" style="color:var(--text-dim)">0</span></div>
    </div>
    <div style="height: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);">
      <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--purple-light), var(--purple)); box-shadow: 0 0 10px var(--purple-glow); transition: width 0.5s var(--spring);"></div>
    </div>

  <div class="card stagger" style="animation-delay: 0.4s;" id="card-3">

      <div class="finish-hole" id="finish-hole">
        <div class="hole-rim"></div>
        <div class="hole-debris"></div>
        <div class="hole-dust"></div>

      <button class="btn finish" id="btn-finish" onclick="haptic('heavy')">Завершить инвентаризацию</button>
    </div>

<div id="toast"></div>

<div id="sheet-overlay"></div>
<div id="paste-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    Вставка штрихкодов
    <div class="sheet-close" id="sheet-close">✕</div>
  </div>
  <textarea class="sheet-input" id="sheet-input" placeholder="Вставьте список штрихкодов из WMS..."></textarea>
  <button class="btn primary" style="box-shadow: 0 8px 24px var(--purple-glow)" onclick="closeSheet(); showToast('Успешно загружено!'); haptic('medium')">Загрузить данные</button>
</div>

<script>
  let tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();

  function $(id) { return document.getElementById(id); }
  
  function haptic(style) {
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
  }

  /* --- Интерактивный свет (следует за пальцем/курсором) --- */
  document.addEventListener('mousemove', (e) => {
    document.querySelectorAll('.card').forEach(card => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);
    });
  });

  /* --- Логика Шторки (Исправлен баг с залипанием и display) --- */
  const sheet = $('paste-sheet');
  const overlay = $('sheet-overlay');
  
  $('btn-paste-wms').addEventListener('click', function(e) {
    haptic('medium');
    let r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = e.offsetX + 'px'; r.style.top = e.offsetY + 'px';
    this.appendChild(r);
    setTimeout(() => r.remove(), 700);

    sheet.classList.remove('closing');
    sheet.classList.add('show');
    overlay.classList.add('show');
  });

  function closeSheet() {
    haptic('light');
    overlay.classList.remove('show');
    sheet.classList.add('closing');
    setTimeout(() => {
      sheet.classList.remove('show', 'closing');
    }, 500); // 0.5s - синхронизировано с анимацией sheetEpicOut
  }
  $('sheet-close').addEventListener('click', closeSheet);
  overlay.addEventListener('click', closeSheet);

  function showToast(msg) {
    const t = $('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 300);
  }

  /* ============================================================
     НОВАЯ ЛОГИКА САГИ: 
     - Извлекает логотип из потока на уровень Body для абсолютного Z-Index
     - Математически рассчитывает возврат с учетом скролла
     - Кинематографичные, замедленные тайминги (Max Slow-mo)
     ============================================================ */
  (function initLogoSaga() {
    const mark = $('brand-mark');
    const container = $('brand-logo-container'); // Тот самый фикс текста
    const finishBtn = $('btn-finish');
    const hole = $('finish-hole');
    const slot = $('finish-slot');
    
    if (!mark || !container || !finishBtn || !hole || !slot) return;

    let playing = false;
    function setVar(el, name, val) { el.style.setProperty(name, val); }

    function playSaga() {
      if (playing) return;
      playing = true;
      haptic('medium');

      const startRect = container.getBoundingClientRect();
      const targetRect = slot.getBoundingClientRect();

      const targetCx = targetRect.left + targetRect.width / 2;
      const targetTopY = targetRect.top - 150; // Поднимаем чуть выше для эпика

      // ФИКС Z-INDEX: Переносим логотип в корень body
      // Теперь его не перекроет ни один контекст наложения (z-index)
      document.body.appendChild(mark);

      // Задаем стартовые координаты (относительно окна)
      setVar(mark, '--saga-home-x', startRect.left + 'px');
      setVar(mark, '--saga-home-y', startRect.top + 'px');
      setVar(mark, '--saga-x', startRect.left + 'px');
      setVar(mark, '--saga-y', startRect.top + 'px');
      setVar(mark, '--saga-target-x', (targetCx - 115) + 'px'); // width 230
      setVar(mark, '--saga-target-y', targetTopY + 'px');

      const CLASSES = ['saga-liftoff', 'saga-rage', 'saga-smash', 'saga-oops', 'saga-return'];
      const timers = [];
      const at = (fn, ms) => timers.push(setTimeout(fn, ms));

      mark.classList.add('saga-playing');

      // 1. Плавный взлёт и полёт (1.8 сек анимации)
      at(() => {
        mark.classList.remove(...CLASSES);
        mark.classList.add('saga-liftoff');
      }, 50);

      // 2. Ярость (Увеличена пауза для саспенса)
      at(() => {
        mark.classList.remove(...CLASSES);
        mark.classList.add('saga-rage');
        haptic('warning');
      }, 1900);

      // 3. Удар 
      at(() => {
        mark.classList.remove(...CLASSES);
        mark.classList.add('saga-smash');
        haptic('heavy');
      }, 3300);

      // Кнопка проваливается, дыра дымит
      at(() => {
        finishBtn.classList.add('smashed');
        hole.classList.add('hole-active');
        haptic('heavy');
      }, 3650);

      // 4. Неловкость (Смущение)
      at(() => {
        mark.classList.remove(...CLASSES);
        mark.classList.add('saga-oops');
        haptic('light');
      }, 4600);

      // 5. Медленный Возврат (Заново считаем координаты!)
      at(() => {
        // Даже если пользователь скроллил страницу, мы берем актуальные координаты контейнера
        const homeRect = container.getBoundingClientRect();
        setVar(mark, '--saga-home-x', homeRect.left + 'px');
        setVar(mark, '--saga-home-y', homeRect.top + 'px');
        
        mark.classList.remove(...CLASSES);
        mark.classList.add('saga-return');
      }, 6400);

      // 6. Окончание саги и сброс состояния
      at(() => {
        mark.classList.remove(...CLASSES, 'saga-playing');
        mark.style.removeProperty('--saga-x');
        mark.style.removeProperty('--saga-y');
        
        // Возвращаем логотип обратно в заготовленный контейнер в шапке
        container.appendChild(mark);

        hole.classList.remove('hole-active');
        finishBtn.classList.remove('smashed');
        finishBtn.classList.add('restoring');
        
        // Форсируем перерисовку
        void finishBtn.offsetWidth;
        
        finishBtn.classList.add('restore-in');
        setTimeout(() => {
          finishBtn.classList.remove('restoring', 'restore-in');
        }, 850);

        playing = false;
      }, 8300); // Сага стала длиннее, кинематографичнее и плавнее
    }

    mark.addEventListener('click', playSaga);
  })();

</script>
</body>
</html>
